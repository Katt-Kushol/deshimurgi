<!DOCTYPE html>
<html>
<head>
    	<title>মুরগি এখন কি করে?</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
    <img id="timeImage" src="" alt="Current Status of Our Chicken" class="center-image" style="width:500px;height:600px;">

    <script>
        function updateTimeImage() {
            var now = new Date();
            var hour = now.getHours(); // 0-23
            var imgElement = document.getElementById('timeImage');

            if (hour >= 6 && hour < 18) {
                // Daytime: 5 AM to 5:59 PM
                imgElement.src = "./images/day_image.png";
            } else {
                // Nighttime: 6 PM to 4:59 AM
                imgElement.src = "./images/night_image.png";
            }
        }

        // Run on page load
        window.onload = updateTimeImage;
    </script>
</body>
</html>
